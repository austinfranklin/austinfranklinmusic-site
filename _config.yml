title: Austin Franklin
tagline: "Composer \u00B7 Programmer \u00B7 Researcher \u00B7 Educator"
description: "Composer, sound artist, developer, and researcher. Music, software, research, and scores."
url: "https://austinfranklin.github.io"
baseurl: "/austinfranklinmusic-site"

email: austinalexanderfranklin12@gmail.com

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  software:
    output: true
    permalink: /software/:path/
  music:
    output: true
    permalink: /music/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "software"
    values:
      layout: "work"
  - scope:
      path: ""
      type: "music"
    values:
      layout: "work"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
